spring:
  application:
    name: orders-service

  datasource:
    url: jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  # Caching is enabled per environment; see application-production.yml.
  cache:
    type: none

inventory:
  base-url: http://localhost:8089
